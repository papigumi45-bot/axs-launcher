plugins { id 'com.android.application' }

android {
    namespace 'com.axs.appletv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.axs.appletv'
        minSdk 29
        targetSdk 29
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
